<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduLite - Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Nunito, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #3f51b5 0%, #5c6bc0 55%, #7986cb 100%);
        color: #fff;
        padding: 24px;
      }
      .card {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(12px);
        border-radius: 24px;
        padding: 40px 32px;
        max-width: 440px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      }
      .badge {
        width: 76px;
        height: 76px;
        border-radius: 24px;
        background: #ffc107;
        color: #1a237e;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        font-weight: 800;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 8px;
        opacity: 0.9;
        line-height: 1.6;
      }
      .en {
        font-size: 14px;
        opacity: 0.7;
      }
      button {
        margin-top: 24px;
        border: none;
        cursor: pointer;
        border-radius: 12px;
        padding: 12px 28px;
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        background: #ffc107;
        color: #1a237e;
      }
      button:hover {
        background: #ffca28;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">EL</div>
      <h1>Anda sedang offline</h1>
      <p>Koneksi internet tidak tersedia. Beberapa halaman EduLite masih dapat diakses dari cache.</p>
      <p class="en">You are offline. Please check your internet connection and try again.</p>
      <button onclick="window.location.reload()">Coba Lagi / Retry</button>
    </div>
  </body>
</html>
